name: Ebooks
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/build_ebook.py"
      - ".github/workflows/ebooks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc epubcheck librsvg2-bin
      - name: Build manuscripts
        run: |
          python tools/build_ebook.py en build/eduavr-en.md
          python tools/build_ebook.py no build/eduavr-no.md
      - name: Render covers
        run: |
          rsvg-convert -w 1600 -h 2560 docs/ebook/cover-en.svg -o build/cover-en.png
          rsvg-convert -w 1600 -h 2560 docs/ebook/cover-no.svg -o build/cover-no.png
      - name: Build EPUB editions
        run: |
          pandoc build/eduavr-en.md -o build/EduAVR-en.epub --toc --metadata-file=docs/ebook/metadata-en.yaml --epub-cover-image=build/cover-en.png
          pandoc build/eduavr-no.md -o build/EduAVR-no.epub --toc --metadata-file=docs/ebook/metadata-no.yaml --epub-cover-image=build/cover-no.png
      - name: Validate EPUB
        run: epubcheck build/EduAVR-en.epub && epubcheck build/EduAVR-no.epub
      - uses: actions/upload-artifact@v4
        with:
          name: EduAVR-ebooks
          path: |
            build/EduAVR-en.epub
            build/EduAVR-no.epub
