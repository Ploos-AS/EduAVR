name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avr:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: Install AVR toolchain and simulator
        run: apt-get update && apt-get install -y gcc gcc-avr binutils-avr avr-libc avrdude avarice gdb-avr make simavr libsimavr-dev libelf-dev coreutils
      - name: Qualify M1 / Q0
        run: sh tools/check_m1.sh
      - name: Qualify complete M6 milestone
        run: sh tools/check_m6.sh
      - name: Produce V1 visual-source artifacts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          git checkout origin/main -- tools/capture_v1.sh
          sh tools/capture_v1.sh
      - name: Upload V1 visual-source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eduavr-v1-visual-sources
          path: build/visual-v1/
