name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  avr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr binutils-avr avr-libc avrdude make
      - name: Qualify M1 builds
        run: make check
