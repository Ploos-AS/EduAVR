name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avr:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: Install AVR toolchain
        run: apt-get update && apt-get install -y gcc-avr binutils-avr avr-libc avrdude make
      - name: Qualify M1 builds
        run: make check
