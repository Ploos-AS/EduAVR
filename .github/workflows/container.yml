name: container

on:
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - ".github/workflows/container.yml"
      - "tools/check_m1.sh"
      - "tools/check_q1.sh"
      - "tools/q1_*.c"
      - "examples/**"
      - "Makefile"
  pull_request:
    paths:
      - "Containerfile"
      - ".github/workflows/container.yml"
      - "tools/check_m1.sh"
      - "tools/check_q1.sh"
      - "tools/q1_*.c"
      - "examples/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ploos-as/eduavr

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build development image for qualification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: eduavr:test

      - name: Qualify M1/Q0 inside image
        run: docker run --rm -v "$PWD:/workspace" -w /workspace eduavr:test sh tools/check_m1.sh

      - name: Qualify Q1 simulator inside image
        run: docker run --rm -v "$PWD:/workspace" -w /workspace eduavr:test sh tools/check_q1.sh

      - name: Publish development image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:main
