site_name: EduAVR
site_description: Learn AVR microcontrollers with assembly and C
site_url: https://ploos-as.github.io/EduAVR/
repo_url: https://github.com/Ploos-AS/EduAVR
repo_name: Ploos-AS/EduAVR
edit_uri: edit/main/docs/
site_author: Ploos AS
copyright: Copyright &copy; 2026 Ploos AS

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - English:
      - Course outline: en/COURSE_OUTLINE.md
      - Course principles: en/00-course-principles.md
      - Toolchain: en/01-toolchain.md
      - AVR architecture: en/02-avr-architecture.md
      - GPIO: en/03-gpio.md
      - Stack and functions: en/04-stack-functions.md
      - Timers and interrupts: en/05-timers-interrupts.md
      - PWM: en/06-pwm.md
      - USART: en/07-usart.md
      - Dual UART bridge: en/08-dual-uart-bridge.md
      - SPI: en/08-spi.md
      - TWI / I2C: en/09-twi-i2c.md
      - EEPROM: en/10-eeprom.md
      - ADC: en/11-adc.md
      - Appendices:
          - Arduino: en/appendix-a-arduino.md
          - Debugging: en/appendix-b-debugging.md
          - Disassembly and reverse engineering: en/appendix-c-disassembly-reverse-engineering.md
          - C, assembly and compiler: en/appendix-d-c-assembly-compiler.md
          - Memory internals: en/appendix-e-memory-internals.md
          - Programming and bootloaders: en/appendix-f-programming-bootloaders.md
          - Electronics: en/appendix-g-electronics.md
          - Protocol analysis: en/appendix-h-protocol-analysis.md
          - Reading datasheets: en/appendix-i-reading-datasheets.md
  - Norsk:
      - Kursoversikt: no/COURSE_OUTLINE.md
      - Kursprinsipper: no/00-course-principles.md
      - Verktøykjede: no/01-toolchain.md
      - AVR-arkitektur: no/02-avr-architecture.md
      - GPIO: no/03-gpio.md
      - Stack og funksjoner: no/04-stack-functions.md
      - Timere og avbrudd: no/05-timers-interrupts.md
      - PWM: no/06-pwm.md
      - USART: no/07-usart.md
      - Dobbel UART-bro: no/08-dual-uart-bridge.md
      - SPI: no/08-spi.md
      - TWI / I2C: no/09-twi-i2c.md
      - EEPROM: no/10-eeprom.md
      - ADC: no/11-adc.md
      - Appendikser:
          - Arduino: no/appendix-a-arduino.md
          - Debugging: no/appendix-b-debugging.md
          - Disassembly og reverse engineering: no/appendix-c-disassembly-reverse-engineering.md
          - C, assembly og compiler: no/appendix-d-c-assembly-compiler.md
          - Minne og internals: no/appendix-e-memory-internals.md
          - Programmering og bootloadere: no/appendix-f-programming-bootloaders.md
